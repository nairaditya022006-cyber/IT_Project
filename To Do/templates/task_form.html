{% extends 'base.html' %}

{% block title %}{{ action }} Task - TaskFlow{% endblock %}

{% block content %}
<div class="form-container">
    <div class="card">
        <h2>{{ action }} Task</h2>
        <form method="POST">
            <div class="form-group">
                <label for="title">Task Title</label>
                <input type="text" id="title" name="title" required class="form-control" 
                       value="{{ task.title if task else '' }}" placeholder="e.g., Complete IT Project">
            </div>
            
            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <textarea id="description" name="description" class="form-control" rows="3">{{ task.description if task else '' }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="due_date">Due Date</label>
                <input type="date" id="due_date" name="due_date" required class="form-control"
                       value="{{ task.due_date if task else '' }}">
            </div>
            
            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" name="priority" class="form-control">
                    <option value="Low" {% if task and task.priority == 'Low' %}selected{% endif %}>Low</option>
                    <option value="Medium" {% if not task or task.priority == 'Medium' %}selected{% endif %}>Medium</option>
                    <option value="High" {% if task and task.priority == 'High' %}selected{% endif %}>High</option>
                </select>
            </div>

            {% if action == 'Edit' %}
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" class="form-control">
                    <option value="Pending" {% if task.status == 'Pending' %}selected{% endif %}>Pending</option>
                    <option value="Completed" {% if task.status == 'Completed' %}selected{% endif %}>Completed</option>
                </select>
            </div>
            {% endif %}
            
            <div class="form-actions mt-2">
                <button type="submit" class="btn btn-primary">{{ action }} Task</button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
