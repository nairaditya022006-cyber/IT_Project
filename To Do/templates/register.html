{% extends 'base.html' %}

{% block title %}Register - TaskFlow{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <h2 class="text-center">Create an Account</h2>
        <form method="POST" action="{{ url_for('register') }}" onsubmit="return validateRegistration()">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" required class="form-control" placeholder="John Doe">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required class="form-control" placeholder="john@example.com">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required class="form-control" minlength="6">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required class="form-control">
                <small id="password_error" class="text-danger" style="display: none;">Passwords do not match!</small>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
        </form>
        <p class="text-center mt-2">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
